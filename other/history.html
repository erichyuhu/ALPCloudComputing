<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Riwayat Peminjaman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">← Kembali ke Dashboard</a>
            <a href="form.html" class="btn btn-outline-light btn-sm">+ Tambah Baru</a>
            <button id="btnLogout" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">Daftar Inventaris yang Dipinjam</h4>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Peminjam</th>
                                <th>Barang</th>
                                <th>Tanggal</th>
                                <th>Jml</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Peminjaman</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEdit">
                        <input type="hidden" id="editId">
                        <div class="mb-2">
                            <label>Nama Peminjam</label>
                            <input type="text" class="form-control" id="editNama" required>
                        </div>
                        <div class="mb-2">
                            <label>Barang</label>
                            <input type="text" class="form-control" id="editBarang" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-2">
                                <label>Tanggal</label>
                                <input type="date" class="form-control" id="editTanggal" required>
                            </div>
                            <div class="col-3 mb-2">
                                <label>Jml</label>
                                <input type="number" class="form-control" id="editJumlah" required>
                            </div>
                            <div class="col-3 mb-2">
                                <label>Status</label>
                                <select class="form-select" id="editStatus">
                                    <option value="Dipinjam">Dipinjam</option>
                                    <option value="Dikembalikan">Dikembalikan</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">Simpan Perubahan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="history.js"></script>
</body>
</html>
